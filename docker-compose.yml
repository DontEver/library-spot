name: libraryspot

services:
  library:
    container_name: ${CONTAINER_NAME:-library}
    init: true
    pids_limit: 512
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
