<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" ... />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LibrarySpot</title>
    <script>
      // Applied before first paint so a saved theme choice doesn't flash the
      // other theme for a frame - matches library-reservation's own approach.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- StatsSpot Analytics -->
    <!-- If you're reading this and wondering what this tracker is, it's just so I can see who visited my website and put on my resume that I got 500 monthly active users :( -->
    <script src="https://stats.xinci.me/tracker.min.js" data-site="library.xinci.me" defer></script>
  </body>
</html>
